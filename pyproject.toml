[project]
name = "qlora-json-extraction"
version = "0.1.0"
description = "Supervised 4-bit QLoRA fine-tuning for schema-valid receipt information extraction from noisy OCR."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sreeharsha Kannegundla" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "typer>=0.12",
]

[project.scripts]
qlora-extract = "qlora_extraction.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qlora_extraction"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=qlora_extraction --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
